<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="index.html">
          <img
            src="images/logo.png"
            alt="Moyo-logo"
          />
        </a>
      </div>

      <nav>
        <ul>
          <li class="apple">
            <a
              href="index.html"
              class="is-active"
            >
              Apple
            </a>
          </li>
          <li class="samsung">
            <a href="index.html">Samsung</a>
          </li>
          <li class="smartphones">
            <a href="index.html">Smartphones</a>
          </li>
          <li class="lapComp">
            <a
              href="index.html"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="gadgets">
            <a href="index.html">Gadgets</a>
          </li>
          <li class="tablets">
            <a href="index.html">Tablets</a>
          </li>
          <li class="photo">
            <a href="index.html">Photo</a>
          </li>
          <li class="video">
            <a href="index.html">Video</a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
